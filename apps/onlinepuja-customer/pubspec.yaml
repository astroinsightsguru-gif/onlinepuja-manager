publish_to: 'none'

version: 2.3.6+11

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  op_shared:
    path: ../shared
  http: ^1.5.0
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
