name: onlinepuja_astrologer
description: "Online Puja Astrologer - the astrologer-side app."
publish_to: 'none'

version: 2.3.5+10

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  op_shared:
    path: ../shared
  http: ^1.5.0
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  livekit_client: ^2.12.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
